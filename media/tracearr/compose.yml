services:
  tracearr:
    image: ghcr.io/connorgallopo/tracearr:3.1.2
    container_name: tracearr
    restart: unless-stopped
    networks:
      - global_net
      - tracearr-net
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - TZ=${TZ}
      - DATABASE_URL=postgres://tracearr:${DB_PASSWORD}@tracearr-db:5432/tracearr
      - REDIS_URL=redis://tracearr-redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TRUST_PROXY=true
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - tracearr-db
      - tracearr-redis
    volumes:
      - tracearr_backups:/data/backup
      - tracearr_images:/data/tracearr/image-cache
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.tracearr.entrypoints=https'
      - 'traefik.http.services.tracearr.loadbalancer.server.port=3000'

  tracearr-db:
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1
    container_name: tracearr-db
    restart: unless-stopped
    shm_size: 512mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: postgres -c timescaledb.license=timescale -c timescaledb.max_tuples_decompressed_per_dml_transaction=100000 -c max_locks_per_transaction=4096 -c timescaledb.telemetry_level=off -c max_connections=150
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=tracearr
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    networks:
      - tracearr-net

  tracearr-redis:
    image: redis:8.10.2-alpine
    container_name: tracearr-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - tracearr-net

networks:
  tracearr-net:
  global_net:
    external: true

volumes:
  timescale_data:
  redis_data:
  tracearr_backups:
  tracearr_images:
